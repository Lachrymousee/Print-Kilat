<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e8f5c" />
    <meta name="robots" content="noindex" />
    <title>Dashboard Kurir - Print Kilat</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/staff.css" />
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      window.KilatAuth.guard("courier");
    </script>
  </head>
  <body class="staff">
    <header class="site-header">
      <div class="container">
        <a class="staff-brand" href="courier.html"
          ><span class="staff-mark"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-9" /></svg></span
          ><span class="staff-name">Print<b>Kilat</b> <i>/ Staff</i></span></a
        >
        <div class="staff-user">
          <span id="whoLabel"></span
          ><button type="button" class="pill-btn" id="btnLogout">Keluar</button>
        </div>
      </div>
    </header>

    <main class="container staff-main">
      <span class="role-chip">Courier dashboard</span>
      <h1 id="hello">Halo, kurir.</h1>
      <p class="lead">Pantau alur pesanan Print Kilat dari satu tempat.</p>

      <section class="card tasks-card" aria-labelledby="tasksTitle">
        <div class="card-head">
          <div>
            <h2 id="tasksTitle">Tugas pengantaran</h2>
            <p class="sub">Klik tombol untuk mensimulasikan progres pesanan.</p>
          </div>
          <span class="icon-badge"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h11v10H3zM14 9h4l3 3v4h-7" />
              <circle cx="7" cy="18" r="2" />
              <circle cx="17" cy="18" r="2" /></svg
          ></span>
        </div>
        <p class="task-msg" id="taskMsg" role="alert" hidden></p>
        <div class="task-list" id="taskList" aria-live="polite"></div>
      </section>

      <section class="done-list" id="doneBox" hidden>
        <h3>Sudah kamu selesaikan</h3>
        <div id="doneList"></div>
      </section>
    </main>

    <script src="js/db.js"></script>
    <script src="js/orderview.js"></script>
    <script src="js/courier.js"></script>
  </body>
</html>
