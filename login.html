<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e8f5c" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/staff.css" />
    <title>Masuk Staff - Print Kilat</title>
  </head>
  <body class="staff">
    <header class="site-header">
      <div class="container">
        <a class="staff-brand" href="index.html"
          ><span class="staff-mark"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-8" /></svg></span
          ><span class="staff-name">Print<b>Kilat</b> <i>/ Staff</i></span></a
        >
        <a class="pill-btn" href="index.html" style="text-decoration: none"
          >Ke beranda</a
        >
      </div>
    </header>

    <main class="login-wrap">
      <section class="card login-card" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Masuk staf</h1>
        <p class="lead">Untuk admin dan kurir Print Kilat.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                id="pwToggle"
                aria-controls="password"
              >
                Lihat
              </button>
            </div>
          </div>
          <p class="form-error" id="loginError" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" type="submit" id="btnLogin">
            Masuk
          </button>
        </form>

        <div class="hint-box" id="demoHint" hidden>
          <p>Akun demo</p>
          <ul id="demoList"></ul>
          <div class="warn"></div>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
