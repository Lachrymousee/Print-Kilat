<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e8f5c" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/staff.css" />
    <title>Dashboard Admin - Print Kilat</title>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      window.KilatAuth.guard("admin");
    </script>
  </head>
  <body class="staff">
    <header class="site-header">
      <div class="container">
        <a class="staff-brand" href="admin.html"
          ><span class="staff-mark"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-8" /></svg></span
          ><span class="staff-name">Print<b>Kilat</b> <i>/ Staff</i></span></a
        >
        <div class="staff-user">
          <span id="whoLabel"></span
          ><button type="button" class="pill-btn" id="btnLogout">Keluar</button>
        </div>
      </div>
    </header>

    <main class="container staff-main">
      <span class="role-chip">Admin dashboard</span>
      <h1 id="hello">Halo, Admin.</h1>
      <p class="lead">Pantau alur pesanan Print Kilat dari satu tempat.</p>

      <section class="stat-grid" aria-label="Ringkasan">
        <div class="stat">
          <span class="icon-badge"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="5" y="3" width="14" height="18" rx="3" />
              <path d="M9 3h6v3H9zM9 11h6M9 15h6" /></svg
          ></span>
          <p class="stat-label">Total pesanan</p>
          <p class="stat-value" id="statTotal">0</p>
        </div>
        <div class="stat">
          <span class="icon-badge"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h11v10H3zM14 9h4l3 3v4h-7" />
              <circle cx="7" cy="18" r="2" />
              <circle cx="17" cy="18" r="2" /></svg
          ></span>
          <p class="stat-label">Masih berjalan</p>
          <p class="stat-value" id="statRunning">0</p>
        </div>
        <div class="stat">
          <span class="icon-badge"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-8" /></svg
          ></span>
          <p class="stat-label">Pendapatan</p>
          <p class="stat-value" id="statRevenue">Rp0</p>
        </div>
      </section>

      <section class="card list-card" aria-labelledby="listTitle">
        <div class="list-head">
          <h2 id="listTitle">Pesanan terbaru</h2>
          <span class="count-chip" id="countChip">0 order</span>
        </div>
        <div
          class="filters"
          id="filters"
          role="group"
          aria-label="Filter pesanan"
        ></div>
        <div class="order-list" id="orderList"></div>
      </section>

      <div class="demo-tools">
        <p>
          Alat demo. Data pesanan tersimpan di browser ini saja, jadi pesanan
          dari perangkat lain tidak akan muncul di sini.
        </p>
        <button type="button" class="btn btn-ghost btn-sm" id="btnSeed">
          Isi data contoh
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnClear">
          Hapus semua data
        </button>
      </div>
    </main>

    <script src="js/db.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/orderview.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
