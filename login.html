    <main class="login-wrap">
      <section class="card login-card" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Login staff</h1>
        <p class="lead">Untuk admin dan kurir Print Kilat.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                id="pwToggle"
                aria-controls="password"
              >
                Lihat
              </button>
            </div>
          </div>
          <p class="form-error" id="loginError" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" type="submit" id="btnLogin">
            Masuk
          </button>
        </form>

        <div class="hint-box" id="demoHint" hidden>
          <p>Akun demo</p>
          <ul id="demoList"></ul>
          <div class="warn">
            <code>showDemoLoginHint</code> <code>config.js</code>
          </div>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
